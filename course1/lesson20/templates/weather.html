<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='styles//style.css')}}">
    <title>{{title}} Weather</title>
</head>
<body>

    <div class="container">
        <h1>{{title}} Weather</h1>

        <p>{{status}} and {{temp}} &deg;c</p>
        <p>Feels like {{feels_like}} &deg;c</p>
    
        <form class="form-container" action="/weather" >
            <input type="text" name="city" id="city" placeholder="Enter a city name">
            <button type="submit">Submit</button>
        </form>
    
</body>
</html>
